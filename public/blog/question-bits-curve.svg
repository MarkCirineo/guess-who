<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Line chart of Shannon entropy against split ratio for the 24-character Guess Who board. The curve peaks at 1.000 bit for a 12 and 12 split, stays above 0.9 bits for splits between 8 and 16 yes answers, and collapses at the edges: an 8 and 16 split yields 0.918 bits, a 6 and 18 split 0.811 bits, a 4 and 20 split 0.650 bits, and a 2 and 22 split only 0.414 bits.">
  <rect width="760" height="460" fill="#1c1f2b"/>

  <text x="30" y="34" fill="#e8eaf2" font-size="17" font-weight="700">What a yes/no question is worth, in bits</text>
  <text x="30" y="56" fill="#9aa3c0" font-size="12.5">Shannon entropy H = −p·log₂p − q·log₂q for every possible split of the 24-character board</text>

  <!-- gridlines -->
  <line x1="78" y1="92" x2="730" y2="92" stroke="#2a3040" stroke-width="1"/>
  <line x1="78" y1="157" x2="730" y2="157" stroke="#2a3040" stroke-width="1"/>
  <line x1="78" y1="222" x2="730" y2="222" stroke="#2a3040" stroke-width="1"/>
  <line x1="78" y1="287" x2="730" y2="287" stroke="#2a3040" stroke-width="1"/>

  <!-- axes -->
  <line x1="78" y1="92" x2="78" y2="352" stroke="#565d75" stroke-width="1.5"/>
  <line x1="78" y1="352" x2="730" y2="352" stroke="#565d75" stroke-width="1.5"/>

  <!-- y labels -->
  <text x="68" y="96" fill="#9aa3c0" font-size="11" text-anchor="end">1.00</text>
  <text x="68" y="161" fill="#9aa3c0" font-size="11" text-anchor="end">0.75</text>
  <text x="68" y="226" fill="#9aa3c0" font-size="11" text-anchor="end">0.50</text>
  <text x="68" y="291" fill="#9aa3c0" font-size="11" text-anchor="end">0.25</text>
  <text x="68" y="356" fill="#9aa3c0" font-size="11" text-anchor="end">0</text>
  <text x="24" y="222" fill="#9aa3c0" font-size="11.5" text-anchor="middle" transform="rotate(-90 24 222)">Bits gained per question</text>

  <!-- x ticks -->
  <text x="78" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">0</text>
  <text x="186.7" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">4</text>
  <text x="295.3" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">8</text>
  <text x="404" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">12</text>
  <text x="512.7" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">16</text>
  <text x="621.3" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">20</text>
  <text x="730" y="369" fill="#9aa3c0" font-size="11" text-anchor="middle">24</text>
  <text x="404" y="388" fill="#9aa3c0" font-size="12" text-anchor="middle">Size of the "yes" group, k (out of 24 characters)</text>

  <!-- perfect-split marker -->
  <line x1="404" y1="92" x2="404" y2="352" stroke="#ECB309" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- entropy curve -->
  <polyline fill="none" stroke="#3B76ED" stroke-width="2.5" stroke-linejoin="round" points="78,352 105.2,287 132.3,244.4 159.5,210.7 186.7,183 213.8,160 241,141.1 268.2,125.6 295.3,113.2 322.5,103.9 349.7,97.2 376.8,93.3 404,92 431.2,93.3 458.3,97.2 485.5,103.9 512.7,113.2 539.8,125.6 567,141.1 594.2,160 621.3,183 648.5,210.7 675.7,244.4 702.8,287 730,352"/>

  <!-- plotted real questions -->
  <circle cx="132.3" cy="244.4" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="142" y="249" fill="#c8cbd8" font-size="11">bowtie · bald — 0.414 bits</text>

  <circle cx="186.7" cy="183" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="196" y="187" fill="#c8cbd8" font-size="11">blonde · red hair — 0.650</text>

  <circle cx="241" cy="141.1" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="250" y="145" fill="#c8cbd8" font-size="11">black · brown hair — 0.811</text>

  <circle cx="295.3" cy="113.2" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="304" y="117" fill="#c8cbd8" font-size="11">glasses · hat — 0.918</text>

  <line x1="462" y1="96" x2="494" y2="88" stroke="#565d75" stroke-width="1"/>
  <circle cx="458.3" cy="97.2" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="498" y="91" fill="#c8cbd8" font-size="11">smiling 14/10 — 0.980</text>

  <line x1="490" y1="105" x2="536" y2="110" stroke="#565d75" stroke-width="1"/>
  <circle cx="485.5" cy="103.9" r="4.5" fill="#3B76ED" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="540" y="113" fill="#c8cbd8" font-size="11">any accessories 15/9 — 0.954</text>

  <circle cx="404" cy="92" r="6" fill="#ECB309" stroke="#1c1f2b" stroke-width="1.5"/>
  <text x="404" y="78" fill="#ECB309" font-size="11.5" font-weight="600" text-anchor="middle">★ 12/12 — exactly 1.000 bit</text>

  <!-- notes -->
  <text x="78" y="416" fill="#c8cbd8" font-size="11.5">Near-half is nearly as good as half: a 14/10 split still pays 0.980 of a bit.</text>
  <text x="78" y="436" fill="#9aa3c0" font-size="11.5" font-style="italic">The edges collapse. A bowtie question buys 0.414 bits — less than half of what a gender question buys.</text>
</svg>
